# Configuración del gate IaC (Checkov). Riesgos aceptados tras el triaje, con su justificación.
# Los checks omitidos por recurso se declaran en el propio manifiesto (anotaciones checkov.io/skip).
compact: true
skip-check:
  # HEALTHCHECK de Docker: Kubernetes no lo usa; la salud se comprueba con las sondas liveness y
  # readiness declaradas en cada Deployment.
  - CKV_DOCKER_2
# El Terraform de referencia para GKE no se pasa al gate (ver devsecops.yml): no se despliega en el
# laboratorio; sus hallazgos siguen en el informe y en el backlog (CKV_GCP_66, Binary Authorization, es
# el equivalente gestionado del control de admisión con Kyverno implementado en el pipeline).
